<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560">
  <!-- Đường cong nhiệt độ hạt của mẻ rang #041 (số liệu minh họa).
       Trục ngang: thời gian 1:10 → 12:30. Trục dọc: nhiệt độ 80°C → 215°C. -->
  <style>
    .cong { fill: none; stroke: #e2601e; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .vach { stroke: #1c1712; stroke-width: 2; }
    .mau-moc { stroke: #e2601e; stroke-width: 2; stroke-dasharray: 8 8; }
    .moc-nhat { stroke: #4c5649; stroke-width: 1.5; stroke-dasharray: 4 8; }
    @media (prefers-reduced-motion: no-preference) {
      .cong { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ve 2.4s cubic-bezier(.16, 1, .3, 1) .2s forwards; }
    }
    @keyframes ve { to { stroke-dashoffset: 0; } }
  </style>

  <!-- trục thời gian và vạch từng phút (2, 4, 6, 8, 10, 12) -->
  <line class="vach" x1="0" y1="546" x2="1590" y2="546"/>
  <path d="M1600 546 l-20 -9 v18 z" fill="#1c1712"/>
  <g class="vach">
    <line x1="149" y1="538" x2="149" y2="554"/>
    <line x1="410" y1="538" x2="410" y2="554"/>
    <line x1="671" y1="538" x2="671" y2="554"/>
    <line x1="932" y1="538" x2="932" y2="554"/>
    <line x1="1194" y1="538" x2="1194" y2="554"/>
    <line x1="1455" y1="538" x2="1455" y2="554"/>
  </g>

  <!-- mốc hết giai đoạn sấy (4:30) và nổ lần 1 (9:40) -->
  <line class="moc-nhat" x1="475" y1="250" x2="475" y2="546"/>
  <line class="mau-moc" x1="1150" y1="93" x2="1150" y2="546"/>

  <!-- đường cong nhiệt độ hạt -->
  <path class="cong" pathLength="1"
        d="M40 494 C 120 420, 200 345, 279 309 S 450 245, 541 232 S 720 190, 802 174 S 1050 112, 1150 93 S 1270 80, 1324 74 S 1460 62, 1520 58"/>

  <!-- các điểm mốc -->
  <circle cx="40" cy="494" r="9" fill="#eef1ea" stroke="#1c1712" stroke-width="3"/>
  <circle cx="475" cy="250" r="8" fill="#eef1ea" stroke="#1c1712" stroke-width="3"/>
  <circle cx="1150" cy="93" r="11" fill="#e2601e"/>
  <circle cx="1520" cy="58" r="15" fill="#1c1712"/>
</svg>

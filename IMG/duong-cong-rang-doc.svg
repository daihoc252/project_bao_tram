<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <!-- Bản dọc cho điện thoại: thời gian chạy từ trên xuống, nhiệt độ tăng sang phải (số liệu minh họa). -->
  <style>
    .cong { fill: none; stroke: #e2601e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .vach { stroke: #1c1712; stroke-width: 2; }
    .mau-moc { stroke: #e2601e; stroke-width: 2; stroke-dasharray: 6 6; }
    .moc-nhat { stroke: #4c5649; stroke-width: 1.5; stroke-dasharray: 3 6; }
    @media (prefers-reduced-motion: no-preference) {
      .cong { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ve 2.4s cubic-bezier(.16, 1, .3, 1) .2s forwards; }
    }
    @keyframes ve { to { stroke-dashoffset: 0; } }
  </style>

  <!-- trục thời gian bên trái, vạch từng phút -->
  <line class="vach" x1="8" y1="0" x2="8" y2="560"/>
  <g class="vach">
    <line x1="2" y1="67" x2="16" y2="67"/>
    <line x1="2" y1="155" x2="16" y2="155"/>
    <line x1="2" y1="243" x2="16" y2="243"/>
    <line x1="2" y1="332" x2="16" y2="332"/>
    <line x1="2" y1="420" x2="16" y2="420"/>
    <line x1="2" y1="508" x2="16" y2="508"/>
  </g>

  <line class="moc-nhat" x1="8" y1="177" x2="228" y2="177"/>
  <line class="mau-moc" x1="8" y1="405" x2="341" y2="405"/>

  <path class="cong" pathLength="1"
        d="M53 30 C 90 60, 150 90, 186 111 S 230 180, 241 199 S 270 260, 283 287 S 330 370, 341 405 S 352 450, 355 464 S 364 510, 366 530"/>

  <circle cx="53" cy="30" r="8" fill="#eef1ea" stroke="#1c1712" stroke-width="3"/>
  <circle cx="228" cy="177" r="7" fill="#eef1ea" stroke="#1c1712" stroke-width="3"/>
  <circle cx="341" cy="405" r="10" fill="#e2601e"/>
  <circle cx="366" cy="530" r="13" fill="#1c1712"/>
</svg>
